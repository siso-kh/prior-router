[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-circuit-router"
version = "0.1.0"
description = "A multi-provider AI model router with live health pings and circuit-breaker punishment thresholds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "siso.kh", email = "arsalenkharrat@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_circuit_router"]
